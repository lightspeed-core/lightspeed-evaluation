# -----------------------------------------------------------------------------
# 18. E2E: Troubleshoot -> escalation -> diagnostics -> case creation
#     Validates the full tool chain: search_knowledge_base, suggest_case_creation,
#     load_diagnostic_questions, record_diagnostic_answer
# -----------------------------------------------------------------------------
- conversation_group_id: sca_e2e_troubleshoot_to_case
  description: >-
    Full escalation path: troubleshoot with KB search, suggest_case_creation,
    diagnostic funnel, then case creation. Exercises the widest set of tools.
  tag: tools
  agent: sca_api

  turns:
    - turn_id: describe_issue
      query: >-
        I'm running Red Hat Enterprise Linux 9.4 and my DNS resolution
        is failing intermittently. /etc/resolv.conf keeps getting
        overwritten by NetworkManager even though I've set it to
        immutable with chattr +i.
      expected_tool_calls:
        -
          - tool_name: update_support_slots
        -
          - tool_name: search_knowledge_base
        -
          - tool_name: hydra_lexical
      turn_metrics:
        - custom:tool_eval
        - "ragas:faithfulness"
        - "geval:technical_accuracy"
      turn_metrics_metadata:
        custom:tool_eval:
          ordered: false
          full_match: false
          allow_extra_arg: true

    - turn_id: tried_suggestion
      query: >-
        Yes, I set the DNS servers via nmcli and set
        dns=none in NetworkManager.conf but it still overwrites
        resolv.conf when the interface reconnects.
      expected_tool_calls:
        -
          - tool_name: search_knowledge_base
        -
          - tool_name: hydra_lexical
      turn_metrics:
        - custom:tool_eval
        - "ragas:faithfulness"
        - "geval:technical_accuracy"
