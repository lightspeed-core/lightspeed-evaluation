      query: >-
        I need a support case for Red Hat Enterprise Linux 8.10.
        We have a service management issue — systemd is failing to
        start the httpd service after a reboot. The error is
        "Failed to start The Apache HTTP Server" with exit code 1.
      extra_request_params:
