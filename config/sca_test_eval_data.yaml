# -----------------------------------------------------------------------------
# 11. record_diagnostic_answer — Single mode sequential answers
# -----------------------------------------------------------------------------
- conversation_group_id: sca_tool_record_answer_single
  description: >-
    Multi-turn diagnostic funnel: user answers one question per turn,
    triggering record_diagnostic_answer in single mode each time.
  tag: tools
  agent: sca_api

  turns:
    - turn_id: start_case
      query: >-
        I want to create a support case for Red Hat Enterprise Linux 9.2.
        My system is experiencing random kernel panics with the error
        "BUG: unable to handle page fault at ffffea0005200000".
      extra_request_params:
        action: create_case
      expected_tool_calls:
        -
          - tool_name: load_diagnostic_questions
      turn_metrics:
        - custom:tool_eval
        - "custom:loop_eval"
      turn_metrics_metadata:
        custom:tool_eval:
          ordered: true
          full_match: false
          allow_extra_arg: true

    - turn_id: answer_when
      query: >-
        It started about three days ago. We've seen it happen four times
        since then, always during peak load hours between 2pm and 5pm.
      extra_request_params:
        action: create_case
      expected_tool_calls:
        -
          - tool_name: record_diagnostic_answer
      turn_metrics:
        - custom:tool_eval
        - "custom:loop_eval"
      turn_metrics_metadata:
        custom:tool_eval:
          ordered: true
          full_match: false
          allow_extra_arg: true

    - turn_id: answer_changes
      query: >-
        Yes, we applied the latest RHEL 9.2 errata updates about a
        week ago. We also added 64GB more RAM to the server the day
        before the panics started.
      extra_request_params:
        action: create_case
      expected_tool_calls:
        -
          - tool_name: record_diagnostic_answer
      turn_metrics:
        - custom:tool_eval
        - "custom:loop_eval"
      turn_metrics_metadata:
        custom:tool_eval:
          ordered: true
          full_match: false
          allow_extra_arg: true

    - turn_id: answer_errors
      query: >-
        The /var/crash directory has four vmcore files. The backtrace
        from crash shows it's in the page allocator code path:
        __alloc_pages_nodemask -> get_page_from_freelist -> node_reclaim.
      extra_request_params:
        action: create_case
      expected_tool_calls:
        -
          - tool_name: record_diagnostic_answer
      turn_metrics:
        - custom:tool_eval
        - "custom:loop_eval"
      turn_metrics_metadata:
        custom:tool_eval:
          ordered: true
          full_match: false
          allow_extra_arg: true

    - turn_id: answer_impact
      query: >-
        It's a database server running PostgreSQL for our ERP system.
        Each crash causes about 30 minutes of downtime while the
        database recovers. About 200 users are affected.
      extra_request_params:
        action: create_case
      expected_tool_calls:
        -
          - tool_name: record_diagnostic_answer
      turn_metrics:
        - custom:tool_eval
        - "custom:loop_eval"
      turn_metrics_metadata:
        custom:tool_eval:
          ordered: true
          full_match: false
          allow_extra_arg: true

    - turn_id: answer_sosreport
      query: I don't have an sosreport yet.
      extra_request_params:
        action: create_case
      expected_tool_calls:
        -
          - tool_name: record_diagnostic_answer
      turn_metrics:
        - custom:tool_eval
        - "custom:loop_eval"
      turn_metrics_metadata:
        custom:tool_eval:
          ordered: true
          full_match: false
          allow_extra_arg: true

