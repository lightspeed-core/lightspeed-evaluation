        - custom:tool_eval
        - "custom:loop_eval"
      turn_metrics_metadata:
        custom:tool_eval:
          ordered: true
          full_match: false
          allow_extra_arg: true

    - turn_id: answer_diagnostics
      query: >-
        It started about two weeks ago after we upgraded from RHEL 9.3
