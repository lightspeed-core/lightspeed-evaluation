          - tool_name: load_diagnostic_questions
      turn_metrics:
        - custom:tool_eval
        - "custom:loop_eval"
      turn_metrics_metadata:
        custom:tool_eval:
          ordered: true
          full_match: false
          allow_extra_arg: true

    - turn_id: dump_all_info
      query: >-
        This started two days ago after we applied security patches.
        No other changes were made. The error in journalctl shows
        "AH00526: Syntax error on line 34 of /etc/httpd/conf.d/ssl.conf".
        It happens every time we try to start the service. This is our
        main web server serving 500 users. We don't have sosreport
        but can get one if needed.
      extra_request_params:
        action: create_case
      expected_tool_calls:
        -
          - tool_name: record_diagnostic_answer
      turn_metrics:
        - custom:tool_eval
        - "custom:loop_eval"
      turn_metrics_metadata:
        custom:tool_eval:
          ordered: true
          full_match: false
          allow_extra_arg: true

