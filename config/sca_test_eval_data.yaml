# -----------------------------------------------------------------------------
# 14. GetCaseDetails — Case lookup by number (MCP)
# -----------------------------------------------------------------------------
- conversation_group_id: sca_tool_case_lookup_by_number
  description: >-
    User requests details of a specific case, triggering GetCaseDetails MCP tool.
  tag: tools
  agent: sca_api

  turns:
    - turn_id: lookup_specific_case
      query: Can you show me the details of case 04296775?
      extra_request_params:
        action: null
      expected_tool_calls:
        -
          - tool_name: GetCaseDetails
      turn_metrics:
        - custom:tool_eval
        - "custom:answer_correctness"
      expected_response: >-
        The response should contain the case details for case 04296775
        including status, severity, product, and description.
      turn_metrics_metadata:
        custom:tool_eval:
          ordered: true
          full_match: false
          allow_extra_arg: true

    - turn_id: ask_for_summary
      query: Can you give me a summary of what's happened on this case?
      extra_request_params:
        action: null
      expected_tool_calls:
        -
          - tool_name: caseSummarize
      turn_metrics:
        - custom:tool_eval
        - "custom:answer_correctness"
      expected_response: >-
        The response should contain a summary of the case history,
        key interactions, and current status.
      turn_metrics_metadata:
        custom:tool_eval:
          ordered: true
          full_match: false
          allow_extra_arg: true

