# -----------------------------------------------------------------------------
# 4. update_support_slots — Progressive product detail collection
# -----------------------------------------------------------------------------
- conversation_group_id: sca_tool_update_slots_progressive
  description: >-
    User provides and corrects product info across turns, triggering
    update_support_slots multiple times to persist field changes.
  tag: tools
  agent: sca_api

  turns:
    - turn_id: provide_product
      query: >-
        It's RHEL 8.10 running on a VMware virtual machine. The system
        reboots every few hours with no warning.
      expected_tool_calls:
        -
          - tool_name: update_support_slots
      turn_metrics:
        - custom:tool_eval
      turn_metrics_metadata:
        custom:tool_eval:
          ordered: true
          full_match: true
          allow_extra_arg: true

    - turn_id: correct_version
      query: >-
        Actually sorry, I checked and it's version 8.8, not 8.10. And
        the severity should be high because this is a production system.
      expected_tool_calls:
        -
          - tool_name: update_support_slots
      turn_metrics:
        - custom:tool_eval
      turn_metrics_metadata:
        custom:tool_eval:
          ordered: true
          full_match: true
          allow_extra_arg: true

# -----------------------------------------------------------------------------
# 5. suggest_case_creation — Escalation after failed troubleshooting
# -----------------------------------------------------------------------------
- conversation_group_id: sca_tool_suggest_case
  description: >-
    Multi-turn troubleshooting does not converge; the LLM should call
    suggest_case_creation after exhausting solutions.
  tag: tools
  agent: sca_api

  turns:
    - turn_id: initial_issue
      query: >-
        I'm running Red Hat Enterprise Linux 9.4 and getting kernel
        soft lockups on CPU 0 every few hours. The call trace shows
        rcu_sched_clock_irq. System is a bare metal server with 128 cores.
      expected_tool_calls:
        -
          - tool_name: update_support_slots
        -
          - tool_name: search_knowledge_base
        -
          - tool_name: hydra_lexical
      turn_metrics:
        - custom:tool_eval
        - "ragas:faithfulness"
        - "geval:technical_accuracy"
      turn_metrics_metadata:
        custom:tool_eval:
          ordered: false
          full_match: false
          allow_extra_arg: true

    - turn_id: tried_suggestion_1
      query: >-
        I already tried rcu_nocbs=0 and updated to the latest kernel
        4.18.0-553.22.1. The lockups continue. I also tried
        nosoftlockup but that just hides the symptom.
      expected_tool_calls:
        -
          - tool_name: search_knowledge_base
        -
          - tool_name: hydra_lexical
      turn_metrics:
        - custom:tool_eval
        - "ragas:faithfulness"
        - "geval:technical_accuracy"
      turn_metrics_metadata:
        custom:tool_eval:
          ordered: false
          full_match: false
          allow_extra_arg: true

    - turn_id: tried_suggestion_2
      query: >-
        None of those articles apply to my situation. The hardware vendor
        says it's a software issue. I've tried every suggestion I can
        find online. This is affecting production workloads.
      expected_tool_calls:
        -
          - tool_name: suggest_case_creation
      turn_metrics:
        - custom:tool_eval
      turn_metrics_metadata:
        custom:tool_eval:
          ordered: true
          full_match: false
          allow_extra_arg: true

