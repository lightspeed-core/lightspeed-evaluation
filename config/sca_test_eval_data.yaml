# =============================================================================
# SCA (Support Case Management Agent) Evaluation Dataset
# =============================================================================
# Each scenario uses expected_tool_calls + custom:tool_eval to validate that
# the agent invokes the correct tools.
#
# Tool inventory:
#   search_knowledge_base             
#   hydra_lexical                       -- lexical search provider (paired with search_knowledge_base)
#   update_support_slots
#   suggest_case_creation
#   load_diagnostic_questions
#   record_diagnostic_answer
#   complete_diagnostics
#   GetCaseDetails                      -- MCP (case_lookup)
#   GetCasesByFilter                    -- MCP (case_lookup)
#   caseSummarize                       -- MCP (case_lookup)
#   fetch_diagnostics_by_session        -- MCP (attachment_analysis)
#
# Routing notes:
#   The system.yaml sets sca_action: troubleshoot globally, which forces
#   the supervisor to route every turn to the troubleshoot node. To reach
#   other nodes, per-turn extra_request_params overrides are required:
#     - action: create_case  → supervisor routes to diagnostics/case_creation
#     - action: null          → removes action hint, lets LLM classify intent
#                               (needed for case_lookup MCP tools)
# =============================================================================

# -----------------------------------------------------------------------------
# 1. search_knowledge_base — RHEL SSH PAM failure
# -----------------------------------------------------------------------------
- conversation_group_id: sca_tool_search_kb_rhel
  description: >-
    RHEL SSH PAM error triggers search_knowledge_base with specific error codes.
  tag: tools
  agent: sca_api

  turns:
    - turn_id: provide_issue
      query: >-
        I'm using Red Hat Enterprise Linux 9.4 and my SSH connections are
        failing with a PAM authentication error after upgrading from 9.3.
        The error in /var/log/secure says "pam_unix(sshd:auth): authentication
        failure; logname= uid=0 euid=0". Password auth worked fine before
        the upgrade.
      expected_tool_calls:
        -
          - tool_name: update_support_slots
        -
          - tool_name: search_knowledge_base
        -
          - tool_name: hydra_lexical
      turn_metrics:
        - custom:tool_eval
        - "ragas:faithfulness"
        - "geval:technical_accuracy"
      turn_metrics_metadata:
        custom:tool_eval:
          ordered: false
          full_match: false
          allow_extra_arg: true

    - turn_id: followup_still_broken
      query: >-
        I checked pam.d/sshd and it looks correct. I'm also seeing
        "sshd[12345]: fatal: PAM: pam_open_session(): Module is unknown"
        in the logs. Could this be related to a missing PAM module?
      expected_tool_calls:
        -
          - tool_name: search_knowledge_base
        -
          - tool_name: hydra_lexical
      turn_metrics:
        - custom:tool_eval
        - "ragas:faithfulness"
        - "geval:technical_accuracy"
      turn_metrics_metadata:
        custom:tool_eval:
          ordered: false
          full_match: false
          allow_extra_arg: true

