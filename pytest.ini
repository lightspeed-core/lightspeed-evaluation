[pytest]
# Pytest configuration for LightSpeed Evaluation Framework

# Test discovery
testpaths = tests
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Output options
addopts =
    -v
    --tb=short
    --strict-markers
    --color=yes
    -m "not integration and not agentic and not offline_e2e"

# Markers
markers =
    integration: Integration tests that require a live Lightspeed API and OPENAI_API_KEY
    agentic: Agentic integration tests that require a live OpenShift cluster with agentic CRDs
    offline_e2e: Offline e2e tests — require OPENAI_API_KEY, no live Lightspeed API needed

# Minimum version
minversion = 6.0

# Test timeout (in seconds)
timeout = 300

# Coverage options (if pytest-cov is installed)
# addopts = --cov=lightspeed_evaluation --cov-report=html --cov-report=term-missing

# Ignore certain warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning:matplotlib.*
    ignore::UserWarning:seaborn.*
